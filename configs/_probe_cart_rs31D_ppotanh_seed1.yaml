# RS31 arm D (improved): arm C plus n_envs 4 and ppo_lr_schedule linear (3e-4 decayed to 0).
# Otherwise identical to _probe_cart_rs31C_ppotanh_seed1.yaml: the 24 pairs c/d/e/f, ranks 2-7 to one
# rank forward (one drawn uniformly per episode per env); 3M steps, 300-step episodes.
# See results/rs31_24_pairs/PREREGISTRATION.md.
#
# run_name is pinned to the file stem.

task: t1
algorithm: ppo
reward_type: shaped
observation: state
seed: 1
total_timesteps: 3000000
device: cpu
num_threads: 1
action_mode: cartesian
max_episode_steps: 300
n_obstacles: 0
train_pairs: ["c2:c3", "c3:c4", "c4:c5", "c5:c6", "c6:c7", "c7:c8", "d2:d3", "d3:d4", "d4:d5", "d5:d6", "d6:d7", "d7:d8", "e2:e3", "e3:e4", "e4:e5", "e5:e6", "e6:e7", "e7:e8", "f2:f3", "f3:f4", "f4:f5", "f5:f6", "f6:f7", "f7:f8"]
shaped_staged: false
place_mode: true
pickup_obs: true
place_obs: true
vecnormalize_clip_reward: 1000
place_posture_gate: true
place_carry_potential: true
ppo_mean_squash: true
ppo_ent_coef: 0.01
ppo_lr_schedule: linear
n_envs: 4
checkpoint_freq: 100000
output_root: runs
run_name: _probe_cart_rs31D_ppotanh_seed1
notes: "RS31 24 pairs"
