# Experiment cell: T1 / SAC / sparse reward / state-vector obs.
# One cell per file by design (not Hydra): flat, diffable, archivable.
# A seed sweep is one copy of this file per seed, with `seed` and nothing else changed.

task: t1
algorithm: sac
reward_type: sparse
observation: state
seed: 0
total_timesteps: 500000

# device: cpu -- MLP/state-vector policies train faster on CPU than GPU here.
# Measured on the real T1 env (PPO, MultiInputPolicy, 20k steps, RTX 2060):
#   cpu 104.75 s (190.9 steps/s) vs cuda 253.06 s (79.0 steps/s), CPU 2.42x faster.
# Leave image/CNN configs without `device` so they resolve to "auto" -> CUDA.
device: cpu

# Pinned for reproducibility, not performance: runs are bit-identical across
# processes at a fixed thread count, but diverge between different counts
# (BLAS reduction order -- the D8 class of effect). Unpinned, torch infers the
# count from the host's core count, so this config would not reproduce on a
# machine with a different core count.
# SAC thread count: 1, decided 13 Sep 2026 from a real 6-core saturation test
# (T2 sparse SAC+HER, 3 simultaneous processes): 1 thread 25.33 steps/s, 2 threads
# 29.30 steps/s (+15.7%). Kept at 1 for consistency with the PPO cells and because
# 2 threads x 3 processes saturates all 6 physical cores on a thermally limited
# laptop over a ~15 h run, which a 2-minute probe cannot rule out. SAC+HER verified
# bit-identical across processes at 1 thread; a 2-thread run diverges from the
# first gradient update. This run's reproducibility is scoped to num_threads=1.
num_threads: 1

max_episode_steps: 100
n_obstacles: 0
checkpoint_freq: 100000
output_root: runs
notes: ""
