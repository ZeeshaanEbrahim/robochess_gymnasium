# RS29 random squares: copy of _probe_cart_place29_ppotanh_seed0.yaml with start_square / target_square
# removed (uniform random distinct pair per episode, t1_pick_and_place.py _resolve_squares), d1 and e1
# excluded (D26), a 400-step episode budget and 3M steps. Everything else -- D29 place reward
# (posture gate, carry potential), ppo_mean_squash, Cartesian action mode -- is identical.
# See results/rs29_random_squares/PREREGISTRATION.md.
#
# run_name is pinned to the file stem.

task: t1
algorithm: ppo
reward_type: shaped
observation: state
seed: 5
total_timesteps: 3000000
device: cpu
num_threads: 1
action_mode: cartesian
max_episode_steps: 400
n_obstacles: 0
excluded_squares: [d1, e1]
shaped_staged: false
place_mode: true
pickup_obs: true
place_obs: true
vecnormalize_clip_reward: 1000
place_posture_gate: true
place_carry_potential: true
ppo_mean_squash: true
checkpoint_freq: 100000
output_root: runs
run_name: _probe_cart_randsq29_ppotanh_seed5
notes: "RS29 random squares"
