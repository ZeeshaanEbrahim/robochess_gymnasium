# Probe, not an experiment cell. Place-mode copy of _probe_cart_pickup_ppo_seed1.yaml: the D28 pick-and-place reward
# (place_mode) and the place observation (place_obs, target minus piece) replace pickup_mode; everything else
# (Cartesian action, e4->e5, home start, 300 steps, 1M steps, seed) is the pick-up probe's.
# pickup_obs stays on: place_mode needs it and place_obs is appended after it.
# vecnormalize_clip_reward: 1000 -- PPO's VecNormalize clips the normalised reward at 10 by default, which would
# clip the 1020 success lump to the same value as a per-step reward (DECISIONS D28). SAC has no VecNormalize.
#
# run_name is pinned, as in the pick-up probes.

task: t1
algorithm: ppo
reward_type: shaped
observation: state
seed: 1
total_timesteps: 1000000
device: cpu
num_threads: 1
action_mode: cartesian
max_episode_steps: 300
n_obstacles: 0
start_square: e4
target_square: e5
shaped_staged: false
place_mode: true
pickup_obs: true
place_obs: true
vecnormalize_clip_reward: 1000
checkpoint_freq: 100000
output_root: runs
run_name: _probe_cart_place_ppo_seed1
notes: "probe of the D28 pick-and-place reward, Cartesian (dx, dy, dz, gripper), e4, home pose, 1M steps, 300-step budget"
