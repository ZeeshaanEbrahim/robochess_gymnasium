# D32 T1 control (results/d32_t1_t2/PREREGISTRATION.md): fixed move e4:e5, no obstacles, D29 config, D31 recipe,
# seed 400, 3,000,000 steps, 300-step episodes. Identical to the rs32 D config (configs/_probe_cart_rs32D_ppotanh_seed0.yaml)
# except start_square, target_square (replacing train_pairs), total_timesteps, seed, run_name, notes.
# run_name is pinned to the file stem.

task: t1
algorithm: ppo
reward_type: shaped
observation: state
seed: 400
total_timesteps: 3000000
device: cpu
num_threads: 1
action_mode: cartesian
max_episode_steps: 300
n_obstacles: 0
start_square: e4
target_square: e5
shaped_staged: false
place_mode: true
pickup_obs: true
place_obs: true
vecnormalize_clip_reward: 1000
place_posture_gate: true
place_carry_potential: true
ppo_mean_squash: true
ppo_ent_coef: 0.01
ppo_lr_schedule: linear
n_envs: 4
checkpoint_freq: 100000
output_root: runs
run_name: d32_t1_e4e5_seed400
notes: "D32 T1 control: fixed e4:e5, no obstacles, D29 config, D31 recipe, 3M steps"
