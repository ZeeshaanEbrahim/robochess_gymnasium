# D32 T2 (results/d32_t1_t2/PREREGISTRATION.md): fixed move e4:e5, two fixed obstacles on d4 and f4, D29 config,
# D31 recipe, seed 200, 3,000,000 steps, 300-step episodes. Identical to configs/d32_t1_e4e5_seed200.yaml except
# task t2, n_obstacles 2, obstacle_squares [d4, f4], run_name, notes. Observation size 47.
# run_name is pinned to the file stem.

task: t2
algorithm: ppo
reward_type: shaped
observation: state
seed: 200
total_timesteps: 3000000
device: cpu
num_threads: 1
action_mode: cartesian
max_episode_steps: 300
n_obstacles: 2
obstacle_squares: ["d4", "f4"]
start_square: e4
target_square: e5
shaped_staged: false
place_mode: true
pickup_obs: true
place_obs: true
vecnormalize_clip_reward: 1000
place_posture_gate: true
place_carry_potential: true
ppo_mean_squash: true
ppo_ent_coef: 0.01
ppo_lr_schedule: linear
n_envs: 4
checkpoint_freq: 100000
output_root: runs
run_name: d32_t2_d4f4_seed200
notes: "D32 T2: fixed e4:e5, obstacles on d4 and f4, D29 config, D31 recipe, 3M steps"
