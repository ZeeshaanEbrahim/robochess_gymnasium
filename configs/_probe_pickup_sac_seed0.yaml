# Probe, not an experiment cell. The D21 pick-up stage (pickup_mode) on the
# e4 start square, joint delta action space, with the pick-up observation
# features on. Base: t1_sac_shaped_state_seed0.yaml (the pilot-matrix SAC
# state-vector cell), which carries no action_mode (so it resolved to
# absolute) and no square keys (random squares per episode); both are
# overridden here so this probe matches the PPO probes' geometry.
#
# SAC gets no VecNormalize and no HER: VECNORMALIZE_ALGORITHMS is {"ppo"} and
# HER_CELLS is {("sac", "sparse")}, both decided in train.py, not here.
#
# run_name is pinned for symmetry with the PPO probes; the derived name would
# have been the same.

task: t1
algorithm: sac
reward_type: shaped
observation: state
seed: 0
total_timesteps: 1000000
device: cpu
num_threads: 1
action_mode: delta
max_episode_steps: 300
n_obstacles: 0
start_square: e4
target_square: e5
shaped_staged: false
pickup_mode: true
pickup_obs: true
checkpoint_freq: 100000
output_root: runs
run_name: _probe_pickup_sac_seed0
notes: "probe of the D21 pick-up reward, joint delta, e4, home pose, 1M steps, 300-step budget"
