# RS32 arm D recipe on 48 start-target pairs (30 neighbour moves, 18 longer moves of 2 or 3 squares),
# seed 200. Identical to _probe_cart_rs31D_ppotanh_seed0.yaml except train_pairs, total_timesteps 5000000,
# seed and run_name. One pair drawn uniformly per episode per env; 300-step episodes.
# See results/rs32_48_pairs/PREREGISTRATION.md.
#
# run_name is pinned to the file stem.

task: t1
algorithm: ppo
reward_type: shaped
observation: state
seed: 200
total_timesteps: 5000000
device: cpu
num_threads: 1
action_mode: cartesian
max_episode_steps: 300
n_obstacles: 0
train_pairs: ["c2:c3", "c3:c4", "c4:c5", "c5:c6", "c6:c7", "c7:c8", "d2:d3", "d3:d4", "d4:d5", "d5:d6", "d6:d7", "d7:d8", "e2:e3", "e3:e4", "e4:e5", "e5:e6", "e6:e7", "e7:e8", "f2:f3", "f3:f4", "f4:f5", "f5:f6", "f6:f7", "f7:f8", "c4:d4", "f5:e5", "d3:e4", "e6:d7", "e5:e4", "c6:c5", "b2:b4", "g3:g6", "d7:d4", "a5:c5", "h4:e4", "b6:e6", "a3:c5", "c3:f6", "h3:f5", "g7:d4", "b7:d5", "e2:g4", "a3:d5", "h6:e4", "c2:e5", "f3:d6", "b4:e6", "g6:e3"]
shaped_staged: false
place_mode: true
pickup_obs: true
place_obs: true
vecnormalize_clip_reward: 1000
place_posture_gate: true
place_carry_potential: true
ppo_mean_squash: true
ppo_ent_coef: 0.01
ppo_lr_schedule: linear
n_envs: 4
checkpoint_freq: 100000
output_root: runs
run_name: _probe_cart_rs32D_ppotanh_seed200
notes: "RS31 24 pairs"
