name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      # Headless runners have no display. osmesa is the CPU fallback documented
      # in the README; egl would need a GPU that standard runners do not have.
      MUJOCO_GL: osmesa
      MUJOCO_MENAGERIE_DIR: ${{ github.workspace }}/.menagerie

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements-dev.txt

      - name: Install OSMesa (software OpenGL for headless MuJoCo rendering)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libosmesa6-dev libgl1 libglew-dev

      # The mesh assets are gitignored and fetched on demand, so the scene --
      # and therefore every test -- cannot load until this has run. Sparse
      # checkout keeps it to the two models we actually use rather than
      # cloning the whole Menagerie.
      - name: Fetch mujoco_menagerie (sparse, shallow)
        run: |
          git clone --depth 1 --filter=blob:none --no-checkout \
            https://github.com/google-deepmind/mujoco_menagerie.git "$MUJOCO_MENAGERIE_DIR"
          cd "$MUJOCO_MENAGERIE_DIR"
          git sparse-checkout init --cone
          git sparse-checkout set universal_robots_ur5e robotiq_2f85
          git checkout

      - name: Fetch mesh assets into assets/
        run: scripts/fetch_assets.sh

      # Deliberately NOT requirements.txt: that is the frozen experiment set and
      # pins a CUDA torch build (~4.5 GB of wheels) that a GPU-less runner
      # cannot use. See the header of requirements-ci.txt.
      - name: Install dependencies (CI set, CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Confirm torch is the CPU build
        run: |
          python -c "import torch; print(torch.__version__); assert torch.__version__.endswith('+cpu'), torch.__version__"

      - name: Verify the scene loads
        run: |
          python -c "import mujoco; mujoco.MjModel.from_xml_path('assets/scene.xml'); print('scene OK')"

      - name: Run test suite
        run: pytest tests/ -v -W error::UserWarning
